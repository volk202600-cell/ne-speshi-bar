<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Ne Speshi Bar — Меню</title>
<link rel="stylesheet" href="style.css">

<style>
.fly-dot{
  position:fixed;
  width:14px;
  height:14px;
  background:#ffb703;
  border-radius:50%;
  pointer-events:none;
  z-index:9999;
  transition:.6s ease;
}
.cart-bounce{
  animation:bounce .4s;
}
@keyframes bounce{
  0%{transform:scale(1)}
  50%{transform:scale(1.2)}
  100%{transform:scale(1)}
}
</style>
</head>

<body>
<header class="topbar">
  <div class="brand">
    <img src="images/logo.png" alt="logo" class="logo">
    <span>Ne Speshi Bar</span>
  </div>
  <div class="right-controls">
    <input id="search" placeholder="Шукати страву..." />
    <button id="open-cart" class="cart-btn">
      🛒 <span id="cart-count">0</span>
    </button>
  </div>
</header>

<main class="container">
  <section class="hero">
    <h1>Меню Ne Speshi Bar</h1>
    <p>Свіжі фото, системний каталог, зручний кошик — зроби замовлення за кілька кліків.</p>
  </section>
  <section id="catalog" class="catalog"></section>
</main>

<!-- Cart drawer -->
<div id="cart-drawer" class="cart-drawer">
  <header class="cart-head">
    <h3>Кошик</h3>
    <button id="close-cart">✕</button>
  </header>

  <div id="cart-contents" class="cart-contents"></div>

  <div class="cart-footer">
    <div class="totals">
      <span>Підсумок:</span>
      <strong id="cart-total">0 ₴</strong>
    </div>
    <div class="actions">
      <button id="checkout" class="btn primary">Оформити замовлення</button>
    </div>
  </div>
</div>

<!-- Image modal -->
<div id="img-modal" class="img-modal">
  <img id="img-modal-img">
  <button id="img-modal-close">✕</button>
</div>

<script src="app.js"></script>

<script>
/* АНІМАЦІЯ ДОДАВАННЯ (ловимо будь-яку кнопку "Додати") */
document.addEventListener('click', e => {
  if(e.target.textContent.trim() === 'Додати'){
    const cartBtn = document.getElementById('open-cart');
    const c = cartBtn.getBoundingClientRect();
    const r = e.target.getBoundingClientRect();

    const d = document.createElement('div');
    d.className = 'fly-dot';
    d.style.left = r.left+'px';
    d.style.top = r.top+'px';
    document.body.appendChild(d);

    setTimeout(()=>{
      d.style.left = c.left+'px';
      d.style.top = c.top+'px';
      d.style.opacity='0';
      d.style.transform='scale(.2)';
    },10);

    setTimeout(()=>{
      d.remove();
      cartBtn.classList.add('cart-bounce');
      setTimeout(()=>cartBtn.classList.remove('cart-bounce'),400);
    },600);
  }
});

/* ПРАВИЛЬНИЙ ПОРЯДОК ОФОРМЛЕННЯ */
document.getElementById('checkout').onclick = () => {
  const address = prompt('Введіть адресу доставки');
  if(!address) return alert('Адреса обовʼязкова');

  const comment = prompt('Коментар до замовлення (необовʼязково)') || '—';

  const payment = prompt('Спосіб оплати: готівка / онлайн');
  if(!payment) return alert('Оберіть спосіб оплати');

  /* тут піде Telegram */
  console.log({
    address,
    comment,
    payment
  });

  alert(
    'Замовлення прийнято 👍\n\n' +
    'Адреса: ' + address + '\n' +
    'Коментар: ' + comment + '\n' +
    'Оплата: ' + payment
  );
};
</script>

</body>
</html>
