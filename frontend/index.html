<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Не спеши — замовлення</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #111;
  color: #fff;
}

.container {
  padding: 20px;
  max-width: 800px;
}

.menu-item {
  background: #1e1e1e;
  padding: 15px;
  margin-bottom: 10px;
  border-radius: 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.menu-item button {
  background: #ff9800;
  border: none;
  padding: 8px 14px;
  border-radius: 6px;
  cursor: pointer;
  font-weight: bold;
}

/* 🛒 КОШИК */
.cart {
  position: fixed;
  right: 15px;
  top: 15px;
  width: 260px;
  background: #222;
  border-radius: 12px;
  padding: 12px;
  box-shadow: 0 0 20px rgba(0,0,0,.6);
}

.cart h3 {
  margin-top: 0;
  text-align: center;
}

.cart-items {
  font-size: 14px;
}

.cart-total {
  margin-top: 10px;
  font-weight: bold;
}

/* ✨ АНІМАЦІЯ */
.fly {
  position: fixed;
  z-index: 999;
  pointer-events: none;
  transition: all 0.7s ease-in-out;
}

/* 🧾 ФОРМА */
.order {
  margin-top: 30px;
  background: #1c1c1c;
  padding: 20px;
  border-radius: 10px;
}

.order input {
  width: 100%;
  padding: 10px;
  margin-bottom: 10px;
  border-radius: 6px;
  border: none;
}

.order button {
  width: 100%;
  padding: 12px;
  background: #4caf50;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="container">
  <h1>Не спеши — меню</h1>

  <div class="menu-item">
    <span>Бургер з рваною телятиною — 180₴</span>
    <button onclick="addToCart('Бургер', 180, event)">+</button>
  </div>

  <div class="menu-item">
    <span>Картопля фрі — 70₴</span>
    <button onclick="addToCart('Фрі', 70, event)">+</button>
  </div>

  <div class="menu-item">
    <span>Кола — 40₴</span>
    <button onclick="addToCart('Кола', 40, event)">+</button>
  </div>

  <!-- 🧾 ЗАМОВЛЕННЯ -->
  <div class="order">
    <h2>Оформлення</h2>

    <input id="address" placeholder="Введіть адресу доставки">

    <input type="file" id="file">
    <div id="fileName" style="font-size:14px; opacity:.8;"></div>

    <button onclick="makeOrder()">Зробити замовлення</button>
  </div>
</div>

<!-- 🛒 КОШИК -->
<div class="cart" id="cart">
  <h3>🛒 Кошик</h3>
  <div class="cart-items" id="cartItems">Порожньо</div>
  <div class="cart-total" id="cartTotal">Сума: 0 ₴</div>
</div>

<script>
let cart = [];
let total = 0;

function addToCart(name, price, event) {
  cart.push({name, price});
  total += price;
  renderCart();
  flyAnimation(event.target);
}

function renderCart() {
  const items = document.getElementById('cartItems');
  items.innerHTML = cart.map(i => `${i.name} — ${i.price}₴`).join('<br>');
  document.getElementById('cartTotal').innerText = `Сума: ${total} ₴`;
}

const fileInput = document.getElementById('file');
const fileName = document.getElementById('fileName');

fileInput.addEventListener('change', () => {
  if (fileInput.files.length > 0) {
    fileName.innerText = 'Файл: ' + fileInput.files[0].name;
  }
});

function makeOrder() {
  const address = document.getElementById('address').value;
  const file = fileInput.files[0];

  if (!address) {
    alert('Введіть адресу доставки');
    return;
  }

  if (!file) {
    alert('Завантажте файл');
    return;
  }

  alert(
    'Замовлення прийнято!\n\n' +
    'Адреса: ' + address + '\n' +
    'Файл: ' + file.name + '\n' +
    'Сума: ' + total + ' ₴'
  );
}

function flyAnimation(btn) {
  const rect = btn.getBoundingClientRect();
  const cart = document.getElementById('cart').getBoundingClientRect();

  const fly = document.createElement('div');
  fly.className = 'fly';
  fly.style.left = rect.left + 'px';
  fly.style.top = rect.top + 'px';
  fly.style.width = '20px';
  fly.style.height = '20px';
  fly.style.background = '#ff9800';
  fly.style.borderRadius = '50%';

  document.body.appendChild(fly);

  setTimeout(() => {
    fly.style.left = cart.left + 'px';
    fly.style.top = cart.top + 'px';
    fly.style.opacity = '0';
    fly.style.transform = 'scale(0.2)';
  }, 10);

  setTimeout(() => fly.remove(), 800);
}
</script>

</body>
</html>
